name: Functional Tests
description: "Run QEMU functional tests"

inputs:
  qemu_bin:
    description: "Path to the QEMU binary (relative to workspace root)"
    required: false
    default: "qemu-system-x86_64"
  accel:
    description: "Accelerator to use (kvm or mshv)"
    required: false
    default: "kvm"
  test_filter:
    description: "Test filter (e.g. 'kernel_boot', 'migration_os'). Empty runs default tests."
    required: false
  test_jobs:
    description: "Number of parallel test jobs"
    default: "2"
    required: false
  skip_migration_os_tests:
    description: "Skip migration OS tests (true/false)"
    default: "false"
    required: false
  log-warnings:
    description: "Log warnings from QEMU (true/false)"
    default: "false"
    required: false

runs:
  using: 'composite'
  steps:
  - name: Check dependencies
    working-directory: ${{ github.action_path }}
    shell: bash
    env:
      QEMU_BIN: ${{ inputs.qemu_bin }}
    run: make check-tools

  - name: Install Rust
    uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4

  - name: Build cache params
    shell: bash
    working-directory: ${{ github.action_path }}
    id: build-cache-params
    run: |
      cache_key="payloads-$(md5sum Makefile | cut -d' ' -f1)"
      echo "key=$cache_key" >> $GITHUB_OUTPUT
      {
        echo "path<<EOF"
        make echo-cachable-payloads
        echo "EOF"
      } >> $GITHUB_OUTPUT

  - name: Cache runtime payloads
    uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
    with:
      path: ${{ steps.build-cache-params.outputs.path }}
      key: ${{ steps.build-cache-params.outputs.key }}

  - name: Build tests
    shell: bash
    working-directory: ${{ github.action_path }}
    run: make build-release

  - name: Run tests
    shell: bash
    working-directory: ${{ github.action_path }}
    env:
      ACCEL: ${{ inputs.accel }}
      QEMU_BIN: ${{ inputs.qemu_bin }}
      # No test label contains "notest"; this intentionally skips the default runtime test run.
      TEST_FILTER: notest
      TEST_JOBS: ${{ inputs.test_jobs }}
      TEST_JUNIT_PATH: ${{ github.action_path }}/junit-default.xml
      RUST_LOG: warn
      STDERR_FILTER: ${{ inputs.log-warnings == 'true' && 'cat' || 'grep -v warning:' }}
    run: |
      if [ -z "$TEST_FILTER" ]; then
        unset TEST_FILTER
      fi
      sudo -E env "PATH=$PATH" make run-release 2> >($STDERR_FILTER)

  - name: Run stress-ng os migration tests
    working-directory: ${{ github.action_path }}
    if: ${{ inputs.skip_migration_os_tests != 'true' }}
    shell: bash
    env:
      ACCEL: ${{ inputs.accel }}
      QEMU_BIN: ${{ inputs.qemu_bin }}
      # The stress_ng=true parameter label is emitted by the OS migration test.
      TEST_FILTER: stress_ng=true
      # Run stress-ng migration cases sequentially to avoid shared host resource contention.
      TEST_JOBS: "1"
      TEST_JUNIT_PATH: ${{ github.action_path }}/junit-migration.xml
      FILTER_WARNINGS: ${{ inputs.filter-warnings }}
      RUST_LOG: qemu_test::tests::migration=debug
      STDERR_FILTER: ${{ inputs.log-warnings == 'true' && 'cat' || 'grep -v warning:' }}
    run: |
      sudo make setup-bridge NUM_TAPS=$((TEST_JOBS * 2))
      sudo -E env "PATH=$PATH" make run-release 2> >($STDERR_FILTER)

  - name: Generate test summary
    if: always()
    shell: bash
    working-directory: ${{ github.action_path }}
    run: |
      for f in junit-*.xml; do
        [ -f "$f" ] || continue
        suite_name=$(echo "$f" | sed 's/junit-//;s/\.xml//')
        tests=$(xmlstarlet sel -t -v "/testsuites/testsuite/@tests" "$f")
        failures=$(xmlstarlet sel -t -v "/testsuites/testsuite/@failures" "$f")
        skipped=$(xmlstarlet sel -t -v "/testsuites/testsuite/@skipped" "$f")
        time=$(xmlstarlet sel -t -v "/testsuites/testsuite/@time" "$f")
        passed=$((tests - failures - skipped))

        {
          if [ "$failures" -gt 0 ]; then
            echo "### ❌ ${suite_name} — ${failures} failed, ${passed} passed, ${skipped} skipped (${time}s)"
          else
            echo "### ✅ ${suite_name} — ${passed} passed, ${skipped} skipped (${time}s)"
          fi

          if [ "$failures" -gt 0 ]; then
            echo ""
            echo "| Test | Error |"
            echo "|------|-------|"
            xmlstarlet sel -t -m "//testcase[failure]" -v "@name" -o "|" -v "failure/@message" -n "$f" | while IFS='|' read -r tc_name msg; do
              echo "| ${tc_name} | ${msg} |"
            done
          fi

          echo ""
          echo "<details>"
          echo "<summary>All test results (${tests} tests)</summary>"
          echo ""
          echo "| Status | Test | Time |"
          echo "|--------|------|------|"
          xmlstarlet sel -t -m "//testcase" \
            -i "failure" -o "❌" -b \
            -i "skipped" -o "⚪" -b \
            -i "not(failure) and not(skipped)" -o "✅" -b \
            -o "|" -v "@name" -o "|" -v "@time" -n "$f" | sort -t'|' -k2 | while IFS='|' read -r status tc_name tc_time; do
              echo "| ${status} | ${tc_name} | ${tc_time}s |"
          done
          echo ""
          echo "</details>"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
      done

  - name: Cleanup
    if: always()
    working-directory: ${{ github.action_path }}
    shell: bash
    env:
      TEST_JOBS: ${{ inputs.test_jobs }}
    run: sudo make teardown-bridge || true
